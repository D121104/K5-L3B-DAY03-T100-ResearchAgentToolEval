# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi người dùng khi thiếu thông tin hoặc cần xác nhận hành động.
      QUY TẮC ƯU TIÊN:
      Nếu yêu cầu có hành động gửi, đăng hoặc xuất bản nội dung
      ra bên ngoài, phải gọi clarify với response_type=yes_no
      trước tiên, kể cả khi nội dung được nhắc đến chưa có
      trong ngữ cảnh.
      Không dùng response_type=text cho bước xác nhận hành động gửi/đăng.
      Chỉ dùng response_type=text để hỏi thông tin còn thiếu
      trong các yêu cầu không liên quan đến gửi/đăng.
      Không gọi send trước khi được xác nhận.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Câu hỏi rõ ràng gửi đến người dùng."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          description: >-
            yes_no: bắt buộc cho yêu cầu gửi/đăng/xuất bản,
            kể cả khi nội dung chưa được cung cấp.
            text: hỏi thông tin còn thiếu trong các yêu cầu khác.
            choice: chọn từ danh sách options.
        options:
          type: array
          default: []
          items:
            type: string
          description: "Danh sách lựa chọn, chỉ dùng khi response_type=choice."
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản X/Twitter đã xác định.Dùng khi người dùng yêu cầu xem bài đăng của tài khoản cụ thể.Không dùng để tìm bài đăng theo chủ đề hoặc tìm thông tin trên web."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle X/Twitter không có ký tự @. Ví dụ: Sam Altman → sama; Elon Musk → elonmusk. Không truyền tên hiển thị hoặc URL."}
        limit: {type: integer, default: 5, description: "Số tweet cần lấy. Nếu người dùng yêu cầu 10 tweet thì truyền limit=10; nếu không chỉ định thì mặc định 5."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng công khai trên X/Twitter theo từ khóa hoặc chủ đề. Dùng khi yêu cầu hiện tại vẫn cần tìm tweet theo chủ đề. Không dùng để lấy timeline của một tài khoản cụ thể, tìm bài báo web, hoặc khi người dùng đã bỏ Twitter/tweet và chuyển sang nguồn khác."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề tìm kiếm tweet, giữ đúng nội dung người dùng yêu cầu."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top khi yêu cầu tweet phổ biến/nổi bật/top; Latest khi yêu cầu tweet mới nhất/gần đây. Không dùng Top cho yêu cầu mới nhất."}
        limit: {type: integer, default: 5, description: "Số tweet cần tìm; mặc định 5 nếu không được chỉ định."}
      required: [query]

  - name: lookup
    description: "Tìm thông tin trên web; không dùng để tìm tweet hoặc đọc một URL đã biết. Khi tìm tin tức phải truyền topic=news và timeframe phù hợp. Chỉ gọi thêm social_search khi yêu cầu hiện tại vẫn cần cả web và tweet. Nếu người dùng đã bỏ Twitter/tweet hoặc chuyển sang chỉ tìm web tin tức, chỉ gọi lookup và không gọi social_search."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề cần tìm, giữ đúng từ khóa người dùng; ví dụ tin AI hôm nay dùng query=AI. Biểu diễn loại tin và thời gian bằng topic và timeframe thay vì thêm vào query."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phải truyền news khi người dùng hỏi tin tức/bản tin/news, kể cả yêu cầu nhiều nguồn; general cho tra cứu thông tin thông thường. Không bỏ topic khi tìm tin tức."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Hôm nay/24 giờ dùng day; tuần này dùng week; tháng này dùng month; năm nay dùng year. Truyền rõ khi người dùng chỉ định thời gian; giữ thời gian từ hội thoại nếu chưa được thay đổi."}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung một URL cụ thể đã được cung cấp hoặc tìm thấy. Dùng khi cần đọc hoặc tóm tắt nội dung trang web.Không dùng khi chưa có URL hoặc khi cần tìm kiếm nhiều trang."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Chuyển các items đã thu thập thành văn bản theo template. Dùng khi người dùng yêu cầu tổng hợp hoặc trình bày dữ liệu đã có. Không dùng để tìm kiếm, đọc URL hoặc so sánh dữ liệu."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Gửi hoặc đăng nội dung ra bên ngoài.
      Đây là hành động có side effect và cần xác nhận trước khi thực hiện.
      Không gọi send ngay khi người dùng lần đầu yêu cầu gửi hoặc đăng.
      Trước tiên phải dùng clarify với response_type=yes_no để xin xác nhận
      chính nội dung dự định gửi.
      Chỉ gọi send khi người dùng đã xác nhận rõ ràng nội dung đó.
      Nếu nội dung thay đổi sau xác nhận, phải xin xác nhận lại.
      Không dùng send để trả lời chat thông thường.
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: "Nội dung chính xác đã được người dùng xác nhận để gửi."
        confirmed:
          type: boolean
          default: false
          description: "Chỉ đặt true sau khi người dùng đã xác nhận rõ nội dung gửi. Không tự đặt true từ yêu cầu gửi ban đầu."
      required: [text]

  - name: policy
    description: "Tra cứu chính sách và quy định trong tài liệu nội bộ. Dùng khi người dùng hỏi về quy tắc sử dụng công cụ, trích dẫn nguồn, bảo mật hoặc xuất bản. Không dùng để tìm tin tức hoặc thông tin công khai trên web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học theo từ khóa nghiên cứu. Dùng khi người dùng muốn tìm paper hoặc tài liệu học thuật.Không dùng để đọc toàn văn một paper đã có ID hoặc URL."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa nghiên cứu để tìm paper; không truyền URL hoặc arXiv ID khi mục tiêu là đọc paper đã biết."}
        max_results: {type: integer, default: 5, description: "Số paper tối đa cần trả về; mặc định 5."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "relevance khi tìm paper liên quan nhất; lastUpdatedDate khi cần paper mới cập nhật; submittedDate khi cần paper mới nộp."}
      required: [query]

  - name: paper_text
    description: "Trích xuất nội dung văn bản từ một paper arXiv. Dùng khi đã biết arXiv ID hoặc URL và cần đọc nội dung. Không dùng để tìm paper mới hoặc đọc trang web thông thường."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc URL arXiv cụ thể, ví dụ 1706.03762 hoặc https://arxiv.org/abs/1706.03762. Không tự đoán ID nếu người dùng chưa cung cấp."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần đọc; mặc định 5."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa trích xuất; mặc định 8000."}
      required: [arxiv_url]

